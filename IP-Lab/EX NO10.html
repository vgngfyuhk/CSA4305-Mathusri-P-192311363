<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Bus Ticket Booking</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f2f2f2;
    margin:0;
}

.container{
    max-width:500px;
    margin:40px auto;
    background:white;
    padding:20px;
    border-radius:8px;
    box-shadow:0 0 10px gray;
}

h2{
    text-align:center;
    color:#003366;
}

label{
    font-weight:bold;
}

input,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#007BFF;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

@media(max-width:600px){
.container{
margin:15px;
}
}
</style>

<script>
function bookTicket()
{
var name=document.getElementById("name").value;
var from=document.getElementById("from").value;
var to=document.getElementById("to").value;
var date=document.getElementById("date").value;
var bus=document.getElementById("bus").value;
var seats=document.getElementById("seats").value;

if(name==""||from==""||to==""||date==""||seats=="")
{
alert("Please fill all fields");
return;
}

alert(
"Ticket Booked Successfully!\n\n"+
"Passenger : "+name+
"\nFrom : "+from+
"\nTo : "+to+
"\nJourney Date : "+date+
"\nBus Type : "+bus+
"\nSeats : "+seats
);
}
</script>

</head>

<body>

<div class="container">

<h2>Online Bus Ticket Booking System</h2>

<label>Passenger Name</label>
<input type="text" id="name">

<label>From</label>
<input type="text" id="from">

<label>To</label>
<input type="text" id="to">

<label>Journey Date</label>
<input type="date" id="date">

<label>Bus Type</label>
<select id="bus">
<option>Volvo</option>
<option>Sleeper</option>
<option>AC Coach</option>
<option>Non AC Coach</option>
</select>

<label>Number of Seats</label>
<input type="number" id="seats" min="1">

<button onclick="bookTicket()">Book Ticket</button>

</div>

</body>
</html>
