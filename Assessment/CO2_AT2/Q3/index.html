<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Student Dashboard</h1>
</header>

<div class="dashboard">

    <aside class="sidebar">

        <h2>Menu</h2>

        <ul>
            <li>Home</li>
            <li>Profile</li>
            <li>Courses</li>
            <li>Assignments</li>
            <li>Settings</li>
        </ul>

    </aside>

    <main class="content">

        <div class="card">
            <h3>Total Courses</h3>
            <p>6</p>
        </div>

        <div class="card">
            <h3>Assignments</h3>
            <p>12</p>
        </div>

        <div class="card">
            <h3>Attendance</h3>
            <p>92%</p>
        </div>

        <div class="card">
            <h3>CGPA</h3>
            <p>9.1</p>
        </div>

    </main>

</div>

</body>
</html>
